services:
  apache:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: apache-container-lab
    restart: unless-stopped

    ports:
      - "8080:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q 'Apache Container Lab'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s